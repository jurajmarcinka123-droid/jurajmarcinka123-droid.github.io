name: Publikovať Matikáreň na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Načítať zdrojový kód
        uses: actions/checkout@v6

      - name: Overiť názov repozitára
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" != *.github.io ]]; then
            echo "::error::Repozitár premenujte na VAŠE_GITHUB_MENO.github.io podľa návodu v GITHUB-PAGES.md."
            exit 1
          fi

      - name: Nastaviť pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Nastaviť Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Nainštalovať závislosti
        run: pnpm install --frozen-lockfile

      - name: Zostaviť statickú stránku
        run: pnpm run build

      - name: Nastaviť GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrať zostavenú stránku
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikovať na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
